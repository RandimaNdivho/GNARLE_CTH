<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G★N STUDIO // CHECKOUT</title>
  <link rel="stylesheet" href="Css/style.css">
  <link rel="stylesheet" href="Css/checkout.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>

  <header class="main-header">
    <h1 class="brand-title">GNARLIE.CTH</h1>
    <nav class="tactical-nav">
      <a href="shop.html" class="nav-item" aria-label="Shop">
          <span class="nav-label">Return to Shop</span>
        </a>
    </nav>
  </header>

 <main class="shop-container" style="max-width: 600px; margin: 2rem auto; padding: 0 1rem;">
  <section class="checkout-wrapper" style="width: 100%; border: 1px solid #111; padding: 1.5rem; background: #fff;">
    <h2 style="font-size: 1.1rem; font-weight: 900; letter-spacing: 1.5px; margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem;">
      DISPATCH DETAILS
    </h2>

    <div>
      <div style="margin-bottom: 1rem;">
        <label style="display:block; font-size: 0.75rem; font-weight: 800; margin-bottom: 0.3rem;">FULL NAME *</label>
        <input type="text" id="custName" placeholder="e.g. Guy Nonymous " style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; font-size: 0.85rem;">
      </div>

      <div style="margin-bottom: 1rem;">
        <label style="display:block; font-size: 0.75rem; font-weight: 800; margin-bottom: 0.3rem;">PHONE / WHATSAPP NUMBER *</label>
        <input type="tel" id="custPhone" placeholder="e.g. 066 046 0301" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; font-size: 0.85rem;">
      </div>

      <div style="margin-bottom: 1rem;">
        <label style="display:block; font-size: 0.75rem; font-weight: 800; margin-bottom: 0.3rem;">DELIVERY CITY & ADDRESS *</label>
        <textarea id="custAddress" rows="3" placeholder="Street, Suburb, City, Code" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; font-size: 0.85rem;"></textarea>
      </div>

      <div id="checkoutSummary" style="background: #f8f8f8; padding: 1rem; border: 1px solid #eee; margin: 1.5rem 0;"></div>

      <button type="button" id="confirmWhatsAppBtn" class="camo-accent-btn" style="width: 100%; padding: 0.9rem; font-size: 0.85rem; font-weight: 900; cursor: pointer;">
        CONFIRM ORDER VIA WHATSAPP →
      </button>
    </div>
  </section>
</main>

<script src="Js/checkout.js"></script>

 
</body>
</html>
